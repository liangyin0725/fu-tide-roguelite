<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>符潮残夜</title>
    <link rel="icon" href="data:," />
    <style>
      .file-launch {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #080912;
        color: #f8fbff;
        font-family: system-ui, sans-serif;
      }
      .file-launch main { width: min(420px, calc(100vw - 40px)); }
      .file-launch h1 { margin: 0 0 12px; }
      .file-launch p { color: #b8c4d6; line-height: 1.7; }
      .file-launch a { color: #61f5ff; }
      .file-launch code { color: #f6d365; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="hud-root"></div>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.body.className = 'file-launch';
        document.body.innerHTML = `
          <main>
            <h1>符潮残夜</h1>
            <p>游戏需要由本地开发服务器加载，不能直接运行 TypeScript 源文件。</p>
            <p>双击 <code>start-game.cmd</code>，或打开 <a href="http://127.0.0.1:5173/">http://127.0.0.1:5173/</a>。</p>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
